backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Website Content"
    files:
      - name: "general"
        label: "SAF Enterprise — Edit Website"
        file: "content/site.json"
        fields:
          - { label: "Phone (for call links, e.g. +8801644333138)", name: "phone", widget: "string" }
          - { label: "Phone (shown on page, e.g. +880 1644-333138)", name: "phoneDisplay", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "WhatsApp Link", name: "whatsapp", widget: "string" }
          - { label: "Hero — Small Label", name: "heroEyebrow", widget: "string" }
          - { label: "Hero — Headline (wrap the golden word in <em></em>)", name: "heroHeadline", widget: "string" }
          - { label: "Hero — Subheadline", name: "heroSubheadline", widget: "text" }
          - { label: "About — Paragraph 1", name: "aboutText1", widget: "text" }
          - { label: "About — Paragraph 2", name: "aboutText2", widget: "text" }
          - label: "Services"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Small Tag (e.g. Mat.01)", name: "tag", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Client Name", name: "name", widget: "string" }
              - { label: "Client Role / Location", name: "role", widget: "string" }
          - label: "Project Gallery"
            name: "gallery"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Project Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Office Interior", value: "office" }
                  - { label: "Home Interior", value: "home" }
                  - { label: "Glass Partition", value: "glass" }
                  - { label: "ACP Cladding", value: "acp" }
                  - { label: "Aluminum Works", value: "aluminum" }
                  - { label: "Ceiling Projects", value: "ceiling" }
